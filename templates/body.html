
<article id="newSaying">
    <form>
        <label>
            Original
            <input
                name="original">
        </label>
        <label>
            Translated
            <input name="translated">
        </label>
        <label>
            Meaning
            <input name="meaning">
        </label>
        <label>
            When to Use
            <input name="whentouse">
        </label>
        <label>
            Tags: 
            <button id="addTag">+</button>
        </label>
    </form>
</article>

{{range $index, $saying := .sayings}}
<article>
    <header>{{$saying.Original}}</header>
    {{$saying.Translation}}
    <footer>Tags</footer>
</article>
{{end}}
