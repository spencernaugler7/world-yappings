<header>
    <div style="display: flex; justify-content: center;">
        <h1>World Sayings</h1>
    </div>
</header>
<main>
    <section>
        <article id="newSaying">
            <form id="newSayingForm" hx-post="/saying/validate" hx-target="body">
                <label>
                    Original
                    <input name="original" hx->
                    <small id="original-validator"></small>
                </label>
                <label>
                    Translated
                    <input name="translated">
                    <small id="translated-validator"></small>
                </label>
                <label>
                    Meaning
                    <input name="meaning">
                    <small id="meaning-validator"></small>
                </label>
                <label>
                    When to Use
                    <input name="whentouse">
                    <small id="whentouse-validator"></small>
                </label>
                <label>
                    Tags: 
                    <button id="addTag">+</button>
                </label>
            </form>
        </article>

        {{range $index, $saying := .sayings}}
        <article>
            <header>{{$saying.Original}}</header>
            {{$saying.Translation}}
            <footer>Tags</footer>
        </article>
        {{end}}
    </section>
    <section>
        {{range $index, $saying := .sayings}}
        <article id="{{$saying.ID}}">
            <header>{{$saying.Original}}</header>
            {{$saying.Translation}}
            <footer>Tags</footer>
        </article>
        {{end}}
    </section>
</main>
<footer>

</footer>
